[project]
name = "energy-ingestion"
version = "0.1.0"
description = "Ingestion, storage, and threshold-alert service for the UNMSM energy monitoring prototype"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "influxdb-client>=1.50.0",
    "jsonschema>=4.26.0",
    "paho-mqtt>=2.2.0",
    "pydantic>=2.14.4",
    "referencing>=0.37.0",
    "rfc3339-validator>=0.1.4",
    "sqlalchemy>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
energy-simulate = "energy_ingestion.cli.simulate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_ingestion"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["energy_ingestion"]

[[tool.mypy.overrides]]
module = ["paho.*", "influxdb_client", "influxdb_client.*"]
ignore_missing_imports = true
implicit_reexport = true

# influxdb_client ships partial annotations; relax only where it is called.
[[tool.mypy.overrides]]
module = ["energy_ingestion.persistence.influx"]
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: fast tests with no external services",
  "integration: needs the Compose stack (make infra-up)",
  "hw: needs the physical prototype; skipped on the PC",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["energy_ingestion"]
branch = true

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pyserial>=3.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyserial>=3.5.0.20261122",
]
