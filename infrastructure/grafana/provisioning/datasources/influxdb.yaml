apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb-energy
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: unmsm-energy
      defaultBucket: energy_raw
      tlsSkipVerify: false
    secureJsonData:
      token: "$__file{/run/secrets/influx-grafana-token}"
